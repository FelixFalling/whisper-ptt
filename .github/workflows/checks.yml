name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -p test_controls.py -v
      - run: python -m unittest discover -s tests -p test_short_entries.py -v
      - run: python -m unittest discover -s tests -p test_logging.py -v
      - run: node --input-type=module --check < gnome-extension/whisper-polish@felixfalling/extension.js
      - run: bash -n bin/whisper-ptt install-links.sh mac/install.sh mac/package.sh
